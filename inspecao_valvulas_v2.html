<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 "Inter","Helvetica Neue",Arial,sans-serif;padding-bottom:150px}
.bar{position:sticky;top:0;z-index:30;background:#2b2b2b;color:#fff;display:flex;align-items:center;gap:11px;

.bar h1{font-size:16px;margin:0;font-weight:650;flex:1}
.bar .sub{display:block;font-size:12px;opacity:.72;font-weight:400;margin-top:2px}
.back{background:rgba(255,255,255,.15);border:0;color:#fff;width:35px;height:35px;border-radius:9px;font-size:21px;cursor:pointer}
.wrap{padding:15px;max-width:700px;margin:0 auto}
h2{font-size:13.5px;font-weight:650;margin:20px 0 9px;color:var(--steel)}
h2:first-child{margin-top:2px}
.card{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.card+.card{margin-top:11px}
label.f{display:block;border-bottom:1px solid var(--rule);padding:8px 13px}
label.f:last-child{border-bottom:0}
label.f span{display:block;font-size:11px;color:var(--steel)}
label.f input,label.f select{width:100%;border:0;outline:0;font:inherit;font-size:16px;background:transparent;padding:3px 0 2px;color:var(--ink)}
.r2{display:flex}.r2>label.f{flex:1;border-right:1px solid var(--rule)}.r2>label.f:last-child{border-right:0}
textarea{width:100%;border:1px solid var(--rule);border-radius:11px;padding:11px 13px;font:inherit;font-size:15px;min-height:80px;background:#fff;outline:0}
input:focus,select:focus,textarea:focus{outline:2px solid #00452e;outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:13px 11px;font:inherit;font-size:14px;

.tile small{font-weight:400;color:var(--steel);font-size:11.5px}
.tile[aria-pressed="true"]{border-color:var(--navy);background:#e7f1ea;box-shadow:inset 0 0 0 1px var(--navy)}
.item{border-bottom:1px solid var(--rule);padding:11px 13px}
.item:last-child{border-bottom:0}
.item .cod{font-size:11px;color:var(--steel);font-weight:600;letter-spacing:.3px}
.item .txt{font-size:15.5px;margin:2px 0 9px;line-height:1.3}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mk{border:1.5px solid var(--rule);background:#fff;border-radius:10px;padding:10px 2px;font:inherit;font-size:12.5px;
    font-weight:650;color:var(--steel);cursor:pointer;min-height:46px;letter-spacing:-.1px}
.mk[data-v="ok"][aria-pressed="true"]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.mk[data-v="nc"][aria-pressed="true"]{background:var(--ncbg);border-color:var(--nc);color:var(--nc)}
.mk[data-v="na"][aria-pressed="true"]{background:var(--nabg);border-color:var(--na);color:var(--na)}
.mk[data-v="falta"][aria-pressed="true"]{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}
.ncbox{margin-top:10px;border:1.5px solid var(--nc);background:var(--ncbg);border-radius:11px;padding:11px}
.ncbox h4{margin:0 0 8px;font-size:12px;color:var(--nc);font-weight:700}
.foto{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.foto img{width:70px;height:70px;object-fit:cover;border-radius:9px;border:1px solid var(--rule)}
.foto button{flex:1;border:1.5px solid var(--nc);background:#fff;color:var(--nc);border-radius:10px;padding:13px 8px;
             font:inherit;font-size:14px;font-weight:650;cursor:pointer;min-height:48px}
.dest{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.dest button{border:1.5px solid var(--rule);background:#fff;border-radius:10px;padding:12px 6px;font:inherit;
             font-size:13.5px;font-weight:600;color:var(--steel);cursor:pointer;min-height:46px}
.dest button[aria-pressed="true"]{border-color:var(--navy);background:#e7f1ea;color:var(--navy)}
.ncbox textarea{min-height:64px;font-size:14.5px}
.prog{height:5px;background:#dde1e7}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .18s}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-size:16px;font-weight:650;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--rule)}
.btn+.btn{margin-top:9px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(242,243,246,.97);border-top:1px solid var(--rule);

.dock .in{max-width:700px;margin:0 auto}
.dock.acima{bottom:56px;padding-bottom:9px}
body.comAbas{padding-bottom:210px}
.tabs{display:flex;gap:4px;background:#fff;border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));
      position:fixed;left:0;right:0;bottom:0;z-index:29}
.tabs button{flex:1;border:0;background:none;font:inherit;font-size:10.5px;font-weight:600;color:var(--steel);
             padding:8px 2px;cursor:pointer;border-radius:9px}
.tabs button[aria-pressed="true"]{color:var(--navy);background:#e7f1ea}

.row .g{flex:1;min-width:0}
.row b{font-size:15px;display:block}
.row small{color:var(--steel);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.pill{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap}
.p-lib{background:var(--okbg);color:var(--ok)}.p-rep{background:var(--ncbg);color:var(--nc)}.p-and{background:var(--amberbg);color:var(--amber)}.p-pend{background:var(--nabg);color:var(--na)}
.syncst{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.16);color:#fff}
.syncst.ok{background:rgba(27,127,75,.95)}.syncst.busy{background:rgba(168,113,26,.95)}.syncst.err{background:rgba(189,43,33,.95)}.syncst.off{background:rgba(255,255,255,.18)}
.empty{text-align:center;color:var(--steel);padding:38px 20px;font-size:14.5px}
.note{font-size:12.5px;color:var(--steel);margin:9px 2px 0;line-height:1.45}
.warn{background:var(--amberbg);border:1px solid #e3cb99;color:#7a5410;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:11px}
.verdict{border-radius:12px;padding:15px;font-weight:700;font-size:17px;text-align:center;border:1.5px solid}
.v-lib{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.v-rep{background:var(--ncbg);border-color:var(--nc);color:var(--nc)}
.v-pend{background:#fff;border-color:var(--rule);color:var(--steel)}

.sheettop button.pr{background:#fff;color:var(--navy)}
.sheet{padding:14px;max-width:820px;margin:0 auto;color:#000;font:12px/1.4 Arial,Helvetica,sans-serif}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border:.8px solid #777;padding:5px 7px;vertical-align:middle}
.sheet h1{background:#00452e;color:#fff;font-size:14px;padding:8px;margin:0 0 9px;text-align:center}
.sheet .sec{background:#00452e;color:#fff;text-align:left;font-size:12px}
.sheet .cod{width:36px;text-align:center;font-weight:bold}
.sheet .mk{text-align:center;font-weight:bold}
.sheet .hd th{background:#dedede;font-size:10px}
.sheet .id td{font-size:11px}.sheet .id b{display:block;font-size:9px;color:#555;font-weight:normal}
.sheet .box{border:.8px solid #777;padding:7px 9px;margin-top:9px;font-size:11px}
.sheet .box b{font-size:9px;color:#555;font-weight:normal;display:block;margin-bottom:3px}
.sheet .res{border:1px solid #000;padding:9px;margin-top:9px;text-align:center;font-weight:bold;font-size:14px}
.sheet .ass{display:flex;gap:24px;margin-top:28px}
.sheet .ass div{flex:1;border-top:1px solid #000;padding-top:5px;font-size:10px;text-align:center}
.sheet .ass b{display:block;font-size:11px}
.sheet .ev h2{font-size:13px;margin:0 0 9px}
.sheet .ev .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.sheet .ev figure{margin:0;border:.8px solid #777;padding:5px}
.sheet .ev img{width:100%;height:auto;display:block}
.sheet .ev figcaption{font-size:9px;margin-top:4px}
@media print{
  body.printing>*:not(.sheetwrap){display:none!important}
  .sheettop{display:none!important}
  .sheetwrap{position:static;overflow:visible}
  .sheet{padding:0;max-width:none;font-size:10.5px}
  .sheet .ev{page-break-before:always}
  @page{size:A4;margin:12mm}
}

const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hoje=()=>new Date().toLocaleDateString("pt-BR");
const soDig=v=>(v||"").replace(/\D/g,"");
const fmtCnpj=v=>{const d=soDig(v);return d.length===14?d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5"):(v||"");};

function fabDe(f){ return {id:"fab_"+String(f.nome).toLowerCase().replace(/[^a-z0-9]+/g,""),nome:f.nome,cnpj:f.cnpj||"",fantasia:f.razao||"",
  endereco:f.endereco||"",municipio:f.municipio||"",uf:f.uf||"",cep:f.cep||"",telefone:"",email:""}; }

function novaOS(){ return {id:uid("O"),numero:"",clienteId:"",data:hoje(),criado:new Date().toISOString(),
  atualizado:new Date().toISOString(),valvulas:[],a1:"",d1:""}; }
function novaValvula(n){ return {id:uid("V"),item:n,tipo:null,fabId:"",modelo:"",bitola:"",tag:"",
  montador:"",pintor:"",video:"",m1:{},nc:{},prop:{}}; }

function itens(c,v){ const val=v||V; if(!val||!val.tipo) return [];
  const t=TIPOS[val.tipo]; return c==="proc"?t.proc:c==="aval"?t.aval:[]; }
const chavesAval=v=>itens("aval",v).map((_,i)=>"aval-"+i);
const textoItem=(k,v)=>itens("aval",v)[+k.split("-")[1]];

function autoProc(){ if(!V||!V.tipo) return; itens("proc").forEach((_,i)=>{ V.m1["proc-"+i]="ok"; }); }

function ncPendente(v){ const val=v||V;
  return chavesAval(val).filter(k=>{ if(val.m1[k]!=="nc") return false;
    const d=val.nc[k]||{}; return !(d.fotos&&d.fotos.length)||!d.destino||!(d.rec||"").trim(); }); }

function valvulaCompleta(v){ const ks=chavesAval(v); return ks.length>0 && ks.every(k=>v.m1[k]) && !ncPendente(v).length; }
function valvulaTemNC(v){ return chavesAval(v).some(k=>v.m1[k]==="nc"); }
function valvulaTemFalta(v){ return chavesAval(v).some(k=>v.m1[k]==="falta"); }
function resultadoValv(v){ const nc=valvulaTemNC(v),fa=valvulaTemFalta(v);
  return nc&&fa?"com não conformidade e faltante":nc?"com não conformidade":fa?"com item faltante":"conforme"; }

function situacaoOS(o){
  if(!o.valvulas.length) return "SEM VÁLVULAS";
  const todas=o.valvulas.every(valvulaCompleta);
  if(!todas || !o.a1) return "EM ANDAMENTO";
  return o.valvulas.some(valvulaTemNC) ? "COM ADITIVO" : "CONCLUÍDA";
}

function custoItem(p){ let c=Number(p.material)||0;
  (cfg.taxas||[]).forEach(t=>{ c+=(Number((p.horas||{})[t.id])||0)*(Number(t.valor)||0); }); return c; }

function aditivosOS(o){
  const out=[];
  o.valvulas.forEach(v=>chavesAval(v).filter(k=>v.m1[k]==="nc").forEach(k=>{
    const p=(v.prop||{})[k]||{};
    out.push({v,k,p,texto:textoItem(k,v)});
  }));
  return out;
}
function totaisOS(o){ let custo=0,preco=0;
  aditivosOS(o).filter(a=>a.p.inc).forEach(a=>{ custo+=custoItem(a.p); preco+=Number(a.p.preco)||0; });
  return {custo,preco,margem:preco-custo,pct:preco>0?(preco-custo)/preco*100:0}; }


/* ============================================================ STORAGE */

const mem={};
const IDB=(()=>{ let dbp=null;
  function db(){ if(!dbp) dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open("newvalvulas",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("kv");
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } });
    return dbp; }
  async function get(k){ const d=await db(); return new Promise((res,rej)=>{
    const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
  async function put(k,v){ const d=await db(); return new Promise((res,rej)=>{
    const tx=d.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
  return {get,put}; })();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
function local(k,v){ try{ if(v===undefined) return window.localStorage.getItem(k);
  if(v===null){ window.localStorage.removeItem(k); return true; }
  window.localStorage.setItem(k,v); return true; }catch(e){ return v===undefined?null:false; } }
/* ---- fotos no aparelho: a OS é gravada com "sbf:<hash>" e cada foto fica em "ft:<hash>" (mesmo formato da nuvem).
   Assim salvar uma OS grande não regrava todas as fotos a cada toque. */
const fotoMem=new Map(), hashMem=new Map(), ftGravada=new Set(); // hash→foto, foto→hash, fotos já gravadas nesta sessão
const ehOS=k=>String(k).startsWith("os:")&&k!=="os:index";
async function hashFoto(v){ let h=hashMem.get(v); if(!h){ h=await hashTxt(v); hashMem.set(v,h); fotoMem.set(h,v); } return h; }
function copiaTroca(x,fn){ if(typeof x==="string"){ const n=fn(x); return n===undefined?x:n; }
  if(Array.isArray(x)) return x.map(y=>copiaTroca(y,fn));
  if(x&&typeof x==="object"){ const o={}; for(const k in x) o[k]=copiaTroca(x[k],fn); return o; }
  return x; }
async function osTextoLeve(o){ // texto da OS com as fotos trocadas por referência; null se não deu para gravar as fotos
  try{ const fotos=[]; copiaTroca(o,v=>{ if(v.startsWith("data:image")) fotos.push(v); });
    for(const v of fotos){ const h=await hashFoto(v); if(!ftGravada.has(h)){ await IDB.put("ft:"+h,v); ftGravada.add(h); } }
    return JSON.stringify(copiaTroca(o,v=>v.startsWith("data:image")?FOTO_PFX+hashMem.get(v):undefined));
  }catch(e){ return null; } }
async function fotosDoAparelho(o){ // troca "sbf:<hash>" pela foto guardada no aparelho (o que faltar fica e vem da nuvem no sync)
  const refs=new Set(); trocaStrings(o,v=>{ if(v.startsWith(FOTO_PFX)) refs.add(v.slice(FOTO_PFX.length)); return undefined; });
  for(const h of refs){ if(fotoMem.has(h)) continue; let t; try{ t=await IDB.get("ft:"+h); }catch(e){}
    if(t){ fotoMem.set(h,t); hashMem.set(t,h); ftGravada.add(h); } }
  if(refs.size) trocaStrings(o,v=>v.startsWith(FOTO_PFX)&&fotoMem.has(v.slice(FOTO_PFX.length))?fotoMem.get(v.slice(FOTO_PFX.length)):undefined);
  return o; }
async function get(k){ const v=await getBruto(k); return (v&&ehOS(k))?await fotosDoAparelho(v):v; }
async function getBruto(k){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r) return JSON.parse(r.value); } }catch(e){}
  if(mem[k]!==undefined) return JSON.parse(mem[k]);
  try{ const t=await IDB.get(k); if(t!==undefined){ mem[k]=t; return JSON.parse(t); } }catch(e){}
  const l=local(k); if(l){ try{ return JSON.parse(l); }catch(e){} }
  return null;
}
async function set(k,v){ const t=(v&&ehOS(k)&&await osTextoLeve(v))||JSON.stringify(v); mem[k]=t;
  let okLocal=false;
  try{ okLocal=await IDB.put(k,t); if(okLocal) local(k,null); }catch(e){ okLocal=false; }
  if(!okLocal) okLocal=local(k,t);
  let okRemote=false;
  try{ if(window.storage&&window.storage.set){ await window.storage.set(k,t); okRemote=true; } }catch(e){}
  if(!okLocal&&!okRemote){
    try{ aviso("ATENÇÃO: não deu para salvar neste aparelho. Os dados estão indo para a nuvem — NÃO feche o app até aparecer ✓ na nuvem, e exporte um backup."); }catch(e){}
    if(!aplicandoNuvem && ehDado(k)) agendarSync();
    return false;
  }
  if(!aplicandoNuvem){ marcarPendente(k); if(ehDado(k)) agendarSync(); }
  return true; }

/* ---- controle de backup */
function ehDado(k){ return (String(k).startsWith("os:")&&k!=="os:index")||k==="clientes"||k==="fabricantes"||k==="cfg"; }
function marcarPendente(k){ if(!ehDado(k)) return;
  try{ const n=(parseInt(local("bkp:pend"),10)||0)+1; local("bkp:pend",String(n)); }catch(e){} }
function marcarBackupFeito(){ try{ local("bkp:ultimo",new Date().toISOString()); local("bkp:pend","0"); }catch(e){} }
function bkpInfo(){ const u=local("bkp:ultimo"); const pend=parseInt(local("bkp:pend"),10)||0;
  let dias=null; if(u){ const t=new Date(u).getTime(); if(!isNaN(t)) dias=Math.floor((Date.now()-t)/86400000); }
  return {ultimo:u,pend,dias}; }
function precisaBackup(){ const b=bkpInfo(); return indice.length>0 && (!b.ultimo || (b.dias!=null&&b.dias>=2) || b.pend>=8); }

async function gerarPacote(){
  const pacote={versao:1, exportado:new Date().toISOString(), cfg, clientes, fabricantes, os:[]};
  for(const m of indice){ const o=(OS&&OS.id===m.id)?OS:await get("os:"+m.id); if(o) pacote.os.push(o); }
  const txt=JSON.stringify(pacote);
  const nome="backup_newvalvulas_"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json";
  return {txt,nome,pacote};
}
async function exportarBackup(opts){ opts=opts||{};
  const {txt,nome}=await gerarPacote();
  let feito=false;
  if(opts.compartilhar && navigator.share){
    try{ const file=new File([txt],nome,{type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Backup New Válvulas"}); feito=true; }
      else { await navigator.share({title:"Backup New Válvulas",text:txt}); feito=true; }
    }catch(e){ if(e&&e.name==="AbortError") return {cancelado:true}; }
  }
  if(!feito){
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
      a.download=nome; document.body.appendChild(a); a.click(); a.remove(); feito=true;
    }catch(e){ aviso("Não consegui gerar o arquivo de backup."); }
  }
  if(feito){ marcarBackupFeito(); aviso("Backup gerado. Guarde o arquivo no seu servidor."); }
  return {txt,nome,feito};
}
async function enviarServidor(){
  const url=(local("bkp:url")||"").trim();
  if(!url){ aviso("Preencha a URL do seu servidor primeiro."); return false; }
  try{ const {txt}=await gerarPacote();
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:txt});
    if(r.ok){ marcarBackupFeito(); aviso("Backup enviado pro seu servidor."); return true; }
    aviso("Seu servidor respondeu "+r.status+". Backup NÃO confirmado."); return false;
  }catch(e){ aviso("Não consegui enviar pro servidor (verifique URL, HTTPS e CORS)."); return false; }
}

async function dedupeFab(){
  try{
    const seen={},remap={},out=[];
    for(const f of fabricantes){ const k=(f.nome||'').trim().toUpperCase();
      if(!k){out.push(f);continue;}
      if(seen[k]) remap[f.id]=seen[k].id; else {seen[k]=f;out.push(f);} }
    if(out.length===fabricantes.length) return;
    const idx=await get("os:index")||[];
    for(const m of idx){ const o=await get("os:"+m.id); if(!o) continue; let ch=false;
      (o.valvulas||[]).forEach(v=>{ if(v.fabId&&remap[v.fabId]){v.fabId=remap[v.fabId];ch=true;} });
      if(ch){ await set("os:"+o.id,o); } }
    out.sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
    fabricantes=out; await set("fabricantes",fabricantes);
  }catch(e){}
}

async function semearSeed(){
  try{
    if(local("nv:seed634")) return;
    if(typeof SEED_DATA==="undefined"||!SEED_DATA){ local("nv:seed634","1"); return; }
    const addU=(arr,extra)=>{ const ids=new Set(arr.map(x=>x.id)); (extra||[]).forEach(x=>{ if(!ids.has(x.id)) arr.push(x); }); };
    addU(clientes,SEED_DATA.clientes); await set("clientes",clientes);
    addU(fabricantes,SEED_DATA.fabricantes); await set("fabricantes",fabricantes);
    if((!cfg.taxas||!cfg.taxas.length) && SEED_DATA.cfg && SEED_DATA.cfg.taxas){ cfg=SEED_DATA.cfg; await set("cfg",cfg); }
    for(const o of []){ // OS de exemplo não é mais semeada (vinha uma versão antiga da OS 634)
      if(indice.some(m=>m.id===o.id)) continue;
      await set("os:"+o.id,o);
      indice.unshift({id:o.id,numero:o.numero,clienteId:o.clienteId,data:o.data,qtd:(o.valvulas||[]).length,situacao:situacaoOS(o),criado:o.criado});
    }
    await set("os:index",indice);
    local("nv:seed634","1");
  }catch(e){}
}

async function boot(){
  cfg=await get("cfg")||cfg;
  if(!cfg.taxas||!cfg.taxas.length) cfg.taxas=JSON.parse(JSON.stringify(TAXAS_PADRAO));
  clientes=await get("clientes")||[];
  fabricantes=await get("fabricantes")||[];
  if(!fabricantes.length){
    fabricantes=FABRICANTES_PADRAO.map(f=>fabDe(f));
    await set("fabricantes",fabricantes);
  }
  indice=await get("os:index")||[];
  TOMB=_tnorm(await get("tombs"));
  await semearSeed();
  await dedupeFab();
}
async function salvar(){
  if(!OS) return;
  if(!aplicandoNuvem){ OS.atualizado=new Date().toISOString(); if(V && OS.valvulas.includes(V)) V.atualizado=OS.atualizado; }
  const meta={id:OS.id,numero:OS.numero,clienteId:OS.clienteId,data:OS.data,
    qtd:OS.valvulas.length,situacao:situacaoOS(OS),criado:OS.criado};
  const i=indice.findIndex(x=>x.id===OS.id);
  if(i>=0) indice[i]=meta; else indice.unshift(meta);
  await set("os:"+OS.id,OS); await set("os:index",indice); cacheOS=null;
}
let tAuto=null; // texto digitado é salvo sozinho, sem esperar trocar de tela

async function abrirOS(id){ const d=await get("os:"+id); if(d){ OS=d; return true; } return false; }
async function apagarOS(id){ await tombstone("os",id); indice=indice.filter(x=>x.id!==id);

/* ---- CNPJ */
async function consultarCNPJ(cnpj){
  const d=soDig(cnpj);
  if(d.length!==14) throw new Error("CNPJ precisa ter 14 dígitos.");
  const fontes=[
    {url:"https://brasilapi.com.br/api/cnpj/v1/"+d,mapa:j=>({nome:j.razao_social||j.nome_fantasia||"",
      fantasia:j.nome_fantasia||"",
      endereco:[j.descricao_tipo_de_logradouro,j.logradouro,j.numero].filter(Boolean).join(" ")+(j.bairro?", "+j.bairro:""),
      municipio:j.municipio||"",uf:j.uf||"",cep:j.cep||"",telefone:j.ddd_telefone_1||"",email:j.email||"",
      situacao:j.descricao_situacao_cadastral||""})},
    {url:"https://publica.cnpj.ws/cnpj/"+d,mapa:j=>{const e=j.estabelecimento||{};
      return {nome:j.razao_social||"",fantasia:e.nome_fantasia||"",
      endereco:[e.tipo_logradouro,e.logradouro,e.numero].filter(Boolean).join(" ")+(e.bairro?", "+e.bairro:""),
      municipio:(e.cidade||{}).nome||"",uf:(e.estado||{}).sigla||"",cep:e.cep||"",
      telefone:[e.ddd1,e.telefone1].filter(Boolean).join(" "),email:e.email||"",situacao:e.situacao_cadastral||""};}}
  ];
  let ultimo="";
  for(const f of fontes){
    try{ const r=await fetch(f.url);
      if(!r.ok){ ultimo=r.status===404?"CNPJ não encontrado na Receita.":"Consulta indisponível agora."; continue; }
      const dados=f.mapa(await r.json());
      if(dados.nome) return dados;
    }catch(e){ ultimo="Sem acesso à consulta online. Preencha à mão."; }
  }
  throw new Error(ultimo||"Não foi possível consultar este CNPJ.");
}

/* ---- foto */
const cam=document.getElementById("cam");
function tirarFoto(cb){
  cam.value="";
  cam.onchange=()=>{ const f=cam.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=900,r=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        let q=0.5,u=cv.toDataURL("image/jpeg",q); while(u.length>136000&&q>0.3){ q-=0.05; u=cv.toDataURL("image/jpeg",q); } cb(u); };
      img.src=fr.result; };
    fr.readAsDataURL(f); };
  cam.click();
}

const app=document.getElementById("app"),dock=document.getElementById("dock"),dockIn=document.getElementById("dockIn"),
  back=document.getElementById("back"),ttl=document.getElementById("ttl"),sub=document.getElementById("sub"),
  pw=document.getElementById("pw"),pb=document.getElementById("pb"),tabsEl=document.getElementById("tabs");

function cab(t,s,v){ ttl.childNodes[0].nodeValue=t; sub.textContent=s||""; back.style.display=v?"block":"none"; }
function setDock(h,comAbas){
  if(!h){ dock.style.display="none"; dockIn.innerHTML=""; dock.classList.remove("acima");
    tabsEl.style.display="flex"; document.body.classList.add("comAbas"); return; }
  dock.style.display="block"; dockIn.innerHTML=h;
  if(comAbas){ tabsEl.style.display="flex"; dock.classList.add("acima"); document.body.classList.add("comAbas"); }
  else { tabsEl.style.display="none"; dock.classList.remove("acima"); document.body.classList.remove("comAbas"); }
}
function prog(p){ if(p==null){pw.style.display="none";return;} pw.style.display="block"; pb.style.width=(p*100)+"%"; }
function aviso(msg){ const d=document.createElement("div"); d.className="warn"; d.textContent=msg;
  d.style.cssText+="position:fixed;left:15px;right:15px;bottom:150px;z-index:60";
  document.body.appendChild(d); setTimeout(()=>d.remove(),4500); }

function tabs(){
  const t=[["os","OS"],["hist","Histórico"],["cli","Clientes"],["fab","Fabricantes"],["cfg","Taxas"]];
  tabsEl.innerHTML=t.map(([k,n])=>`<button data-tab="${k}" aria-pressed="${aba===k}">${n}</button>`).join("");
  tabsEl.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{aba=b.dataset.tab;tela="lista";OS=null;V=null;render();});
}

function render(){
  window.scrollTo(0,0); tabs();
  if(aba==="hist") return tela==="det"?telaHistGrupo():telaHistorico();
  if(aba==="cfg") return telaTaxas();
  if(aba==="cli") return tela==="det"?telaClienteDet():cadastro("cli");
  if(aba==="fab") return tela==="det"?telaFabDet():cadastro("fab");
  if(tela==="lista") return telaOSs();
  if(tela==="os") return telaOS();
  if(tela==="aditivo") return telaAditivo();
  return telaEtapa();
}

function telaOSs(){
  cab("Ordens de serviço","New Válvulas",false); prog(null);
  const q=filtro.trim().toLowerCase();
  const vis=!q?indice:indice.filter(m=>{
    const cli=(clientes.find(c=>c.id===m.clienteId)||{}).nome||"";
    return [m.numero,cli].join(" ").toLowerCase().includes(q); });
  const linhas=vis.map(m=>{
    const s=m.situacao||"EM ANDAMENTO";
    const cls=s==="CONCLUÍDA"?"p-lib":s==="COM ADITIVO"?"p-rep":"p-pend";
    const cli=(clientes.find(c=>c.id===m.clienteId)||{}).nome||"sem cliente";
    return `<button class="row" data-o="${m.id}"><span class="g"><b>${esc(m.numero)||"sem número"}</b>
      <small>${esc(cli)} · ${m.qtd||0} válvula${m.qtd===1?"":"s"} · ${esc(m.data||"")}</small></span>
      <span class="pill ${cls}">${s.toLowerCase()}</span></button>`;
  }).join("");
  const bi=bkpInfo();
  const banner=precisaBackup()?`<div class="warn" style="margin-bottom:11px">
      <b>${!bi.ultimo?"Você ainda não fez backup.":"Último backup há "+bi.dias+" dia"+(bi.dias===1?"":"s")+"."}</b>
      ${bi.pend?" "+bi.pend+" alteração(ões) sem cópia de segurança.":""} Faça um backup e guarde no seu servidor.
      <button class="btn primary" id="bkpnow" style="margin-top:9px;padding:12px">Fazer backup agora</button></div>`:"";
  app.innerHTML=banner+(indice.length?`<label class="f" style="background:#fff;border:1px solid var(--rule);border-radius:12px;margin-bottom:11px">
      <span>Buscar por número da OS ou cliente</span><input id="busca" value="${esc(filtro)}" placeholder="digite para filtrar"></label>`:"")
    +(linhas?`<div class="list">${linhas}</div>`:`<div class="empty">Nenhuma ordem de serviço.<br>Toque em abrir OS para começar.</div>`);
  const bn=document.getElementById("bkpnow");
  if(bn) bn.onclick=async()=>{ const r=await exportarBackup({compartilhar:true}); if(r&&r.cancelado) return; telaOSs(); };
  const bu=document.getElementById("busca");
  if(bu) bu.oninput=()=>{ filtro=bu.value; const p=bu.selectionStart; telaOSs();

/* ---------------- tela da OS */
function telaOS(){

      (clientes.find(c=>c.id===OS.clienteId)||{}).nome||"sem cliente",true);
  prog(null);
  back.onclick=async()=>{ if(OS.numero&&OS.clienteId) await salvar(); tela="lista"; OS=null; render(); };

  const vals=OS.valvulas.map((v,i)=>{

    const fab=(fabricantes.find(f=>f.id===v.fabId)||{}).nome||"";

    return `<div class="row"><span class="g" data-v="${v.id}" style="cursor:pointer">
      <b>Item ${v.item} · ${esc(v.tag)||"sem TAG"}</b>
      <small>${v.tipo?TIPOS[v.tipo].nome:"—"} · ${esc(fab)} ${esc(v.modelo)} ${v.bitola?v.bitola+'"':""}</small></span>
      <span class="pill ${cls}">${st}</span>
      <button data-rmv="${v.id}" aria-label="Excluir válvula" style="border:0;background:none;color:var(--na);font-size:17px;cursor:pointer;padding:8px 4px 8px 12px;margin-left:2px">×</button></div>`;
  }).join("");

  const ad=aditivosOS(OS), T=totaisOS(OS), s=situacaoOS(OS);
  app.innerHTML=`<div class="card">
      <div class="r2">
        <label class="f"><span>Número da OS *</span><input id="osnum" value="${esc(OS.numero)}" placeholder="OS-1042"></label>
        <label class="f"><span>Data de abertura</span><input value="${esc(OS.data)}" disabled style="color:var(--steel)"></label>
      </div>
      <label class="f"><span>Cliente *</span><input id="oscli" list="dlCli" autocomplete="off" placeholder="digite para buscar o cliente…" value="${esc(cliNome)}"><datalist id="dlCli">${optC}</datalist></label>
      <button type="button" class="btn ghost" id="oscliNovo" style="margin:2px 0 8px;padding:8px 12px;font-size:13px">+ cadastrar novo cliente</button>
      <div id="novoCli" style="display:none">
        <label class="f"><span>CNPJ do cliente</span><input id="ncCnpj" inputmode="numeric" placeholder="00.000.000/0000-00"></label>
        <label class="f" style="padding:9px 13px"><button class="btn ghost" id="ncBuscar" style="padding:11px">Buscar dados pelo CNPJ</button></label>
        <label class="f"><span>Razão social</span><input id="ncNome" placeholder="preenche pela consulta"></label>
        <label class="f"><span>Cidade e UF</span><input id="ncCid" placeholder="opcional"></label>
        <label class="f" style="padding:9px 13px"><button class="btn ghost" id="ncSalvar" style="padding:11px">Salvar cliente</button></label>
      </div>
    </div>

    <h2>Válvulas desta OS</h2>
    ${vals?`<div class="list">${vals}</div>`:`<div class="empty" style="padding:26px">Nenhuma válvula ainda.</div>`}
    <button class="btn ghost" id="addv" style="margin-top:10px">Adicionar válvula</button>

    ${ad.length?`<h2>Aditivo</h2><div class="big">
      <div class="tot"><span>Itens não conformes</span><b>${ad.length}</b></div>
      <div class="tot"><span>Incluídos na proposta</span><b>${ad.filter(a=>a.p.inc).length}</b></div>
      <div class="tot"><span>Preço ao cliente</span><b>${brl(T.preco)}</b></div>
      <div class="tot"><span>Margem</span><b class="${T.margem>=0?"mg-ok":"mg-bad"}">${brl(T.margem)}${T.preco>0?" · "+T.pct.toFixed(1)+"%":""}</b></div>
    </div><button class="btn ghost" id="verad" style="margin-top:10px">Montar aditivo</button>`:""}

    <h2>Responsável pela inspeção</h2>
    <div class="card"><div class="r2">
      <label class="f"><span>Nome</span><input id="osa1" value="${esc(OS.a1)}" placeholder="nome"></label>
      <label class="f"><span>Data</span><input id="osd1" value="${esc(OS.d1)}" placeholder="${hoje()}"></label>
    </div></div>
    <h2>Situação</h2><div class="verdict ${s==="CONCLUÍDA"?"v-lib":"v-pend"}">${s}</div>
    <button id="del" style="display:block;margin:28px auto 6px;background:none;border:0;color:var(--nc);font:inherit;font-size:14px;text-decoration:underline;padding:10px;cursor:pointer">Excluir esta OS</button>`;

  document.getElementById("osnum").oninput=e=>{ OS.numero=e.target.value; autoSalvar(); };
  document.getElementById("osa1").oninput=e=>{ OS.a1=e.target.value; autoSalvar(); };
  document.getElementById("osd1").oninput=e=>{ OS.d1=e.target.value; autoSalvar(); };
  const sc=document.getElementById("oscli");
  sc.oninput=()=>{ const v=sc.value.trim().toLowerCase(); const hit=clientes.find(c=>(c.nome||"").toLowerCase()===v); OS.clienteId=hit?hit.id:""; autoSalvar(); };
  const scN=document.getElementById("oscliNovo"); if(scN) scN.onclick=()=>{ const b=document.getElementById("novoCli"); b.style.display="block"; b.scrollIntoView({block:"center"}); };

  const buscar=async()=>{ const b=document.getElementById("ncBuscar"),t=b.textContent;
    b.textContent="Consultando..."; b.disabled=true;
    try{ const dd=await consultarCNPJ(document.getElementById("ncCnpj").value);
      document.getElementById("ncNome").value=dd.nome;
      document.getElementById("ncCid").value=[dd.municipio,dd.uf].filter(Boolean).join(" / ");
      window._dadosCli=dd;
      if(dd.situacao&&!/ATIVA/i.test(dd.situacao)) aviso("Atenção: situação cadastral "+dd.situacao+".");
    }catch(e){ aviso(e.message); }
    b.textContent=t; b.disabled=false; };
  document.getElementById("ncBuscar").onclick=buscar;
  document.getElementById("ncSalvar").onclick=async()=>{
    const nome=document.getElementById("ncNome").value.trim();
    if(!nome){ aviso("Busque pelo CNPJ ou digite o nome."); return; }
    const dd=window._dadosCli||{};
    const novo={id:uid("cli"),nome,cnpj:fmtCnpj(document.getElementById("ncCnpj").value),
      fantasia:dd.fantasia||"",endereco:dd.endereco||"",municipio:dd.municipio||"",uf:dd.uf||"",
      cep:dd.cep||"",telefone:dd.telefone||"",email:dd.email||""};
    window._dadosCli=null; clientes.unshift(novo); await set("clientes",clientes);
    OS.clienteId=novo.id; await salvar(); telaOS(); };

  document.getElementById("addv").onclick=async()=>{
    if(!OS.numero.trim()){ aviso("Preencha o número da OS antes de adicionar válvulas."); return; }
    if(!OS.clienteId){ aviso("Selecione o cliente antes de adicionar válvulas."); return; }
    V=novaValvula(OS.valvulas.length+1); OS.valvulas.push(V);
    await salvar(); tela="etapa"; etapa=0; render(); };

  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    V=OS.valvulas.find(x=>x.id===b.dataset.v); tela="etapa"; etapa=V.tipo?1:0; render(); });
  app.querySelectorAll("[data-rmv]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Excluir esta válvula da OS, com as fotos dela?")) return;
    OS.valvDel=OS.valvDel||{}; OS.valvDel[b.dataset.rmv]=new Date().toISOString();
    OS.valvulas=OS.valvulas.filter(x=>x.id!==b.dataset.rmv);
    OS.valvulas.forEach((v,i)=>v.item=i+1);
    await salvar(); telaOS(); });
  const va=document.getElementById("verad"); if(va) va.onclick=async()=>{ await salvar(); tela="aditivo"; render(); };

  setDock(`<button class="btn primary" id="sv">Salvar OS</button>
           <button class="btn ghost" id="pl">Gerar laudo da OS</button>`);
  dockIn.querySelector("#sv").onclick=async()=>{
    if(!OS.numero.trim()||!OS.clienteId){ aviso("Preencha número da OS e cliente."); return; }
    await salvar(); tela="lista"; OS=null; render(); };
  dockIn.querySelector("#pl").onclick=async()=>{
    if(!OS.valvulas.length){ aviso("Adicione ao menos uma válvula."); return; }
    if(!OS.a1.trim()){ aviso("Preencha o responsável pela inspeção."); return; }
    const inc=OS.valvulas.filter(v=>!v.condenada&&!valvulaCompleta(v));
    if(inc.length){ aviso("Laudo bloqueado: item "+inc.map(v=>v.item).join(", ")+" incompleto. Marque todos os componentes e, nas não conformidades, foto, destino e recomendação."); return; }
    await salvar(); pdfLaudo(); };
  document.getElementById("del").onclick=async()=>{
    if(!confirm("Excluir esta OS com todas as válvulas e fotos? Não tem como desfazer.")) return;
    await apagarOS(OS.id); tela="lista"; OS=null; render(); };
}

/* ---------------- etapas da válvula */
function telaEtapa(){
  const c=ETAPAS[etapa];
  cab(c==="tipo"?"Tipo de válvula":c==="dados"?"Dados da válvula":c==="proc"?"Processo padrão a executar":
      c==="aval"?"Avaliação dos componentes":c==="nc"?"Não conformidades":"Resumo da válvula",
      `OS ${esc(OS.numero)} · item ${V.item} · etapa ${etapa+1} de ${ETAPAS.length}`,true);
  back.onclick=async()=>{ await salvar(); if(etapa>0){etapa--;render();} else {tela="os";V=null;render();} };
  if(c==="tipo") return etTipo();
  if(c==="dados") return etDados();
  if(c==="proc") return etProc();
  if(c==="aval") return etAval();
  if(c==="nc") return etNC();
  return etResumo();
}

function etTipo(){

  app.innerHTML=`<div class="grid2">`+Object.entries(TIPOS).map(([k,t])=>
    `<button class="tile" data-t="${k}" aria-pressed="${V.tipo===k}">${t.nome}<small>${t.desc}${t.prov?" · provisório":""}</small></button>`
  ).join("")+`</div>
  <p class="note">Só a borboleta monobloco está com o padrão definitivo. Os outros tipos seguem provisórios até você passar o padrão de cada um.</p>`;
  setDock("");
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{
    if(V.tipo&&V.tipo!==b.dataset.t){ V.m1={};V.nc={};V.prop={}; }
    V.tipo=b.dataset.t; autoProc(); await salvar(); etapa=1; render(); });
}

      <label class="f" id="vCondMotWrap" style="display:${V.condenada?'block':'none'}"><span>Motivo da condenação</span><input data-k="condenadaMotivo" value="${esc(V.condenadaMotivo)}" placeholder="Ex.: válvula importada sem reposição de peças, inviável recuperar"></label>
      <div class="r2">
        <label class="f"><span>Fabricante</span><input class="fabBusca" list="dlFab" autocomplete="off" placeholder="digite para buscar…" value="${esc(fabNome)}"><datalist id="dlFab">${optF}</datalist></label>
        <label class="f"><span>Bitola</span><select data-s="bitola">${optB}</select></label>
      </div>

      <div id="novoFab" style="display:none">
        <label class="f"><span>CNPJ do fabricante</span><input id="nfCnpj" inputmode="numeric" placeholder="00.000.000/0000-00"></label>
        <label class="f" style="padding:9px 13px"><button class="btn ghost" id="nfBuscar" style="padding:11px">Buscar dados pelo CNPJ</button></label>
        <label class="f"><span>Razão social ou marca</span><input id="nfNome" placeholder="preenche pela consulta"></label>
        <label class="f" style="padding:9px 13px"><button class="btn ghost" id="nfSalvar" style="padding:11px">Salvar fabricante</button></label>
      </div>
      ${f("modelo","Modelo ou linha","ex.: Série 30")}

        <label class="f"><span>Mecânico *</span><select data-s="montador">${optM(V.montador)}</select></label>

      </div>

  app.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>{ V[i.dataset.k]=i.value; autoSalvar(); });

  {const fb=app.querySelector(".fabBusca"); if(fb){ fb.oninput=()=>{ const v=fb.value.trim().toLowerCase(); const hit=fabricantes.find(f=>(f.nome||"").toLowerCase()===v); V.fabId=hit?hit.id:""; autoSalvar(); }; } const fn=document.getElementById("fabNovo"); if(fn) fn.onclick=()=>{ const b=document.getElementById("novoFab"); b.style.display="block"; b.scrollIntoView({block:"center"}); }; const vc=document.getElementById("vCond"); if(vc) vc.onchange=()=>{ V.condenada=vc.checked; autoSalvar(); const w=document.getElementById("vCondMotWrap"); if(w) w.style.display=vc.checked?"block":"none"; };}
  document.getElementById("nfBuscar").onclick=async()=>{

function etProc(){
  autoProc(); prog(1);
  app.innerHTML=`<p class="note" style="margin:0 0 11px">Procedimento padrão da New Equipamentos. Toda válvula passa por todas estas etapas, então elas entram no laudo já como a executar.</p>
    <div class="card">`+itens("proc").map((t,i)=>
      `<div class="item"><div class="cod">E-${i+1} · a executar</div><div class="txt">${t}</div></div>`).join("")+`</div>`;
  setDock(`<button class="btn primary" id="go">Continuar</button>`);
  dockIn.querySelector("#go").onclick=async()=>{ await salvar(); etapa=3; render(); };
}

function etAval(){
  const its=itens("aval"), feitos=its.filter((_,i)=>V.m1["aval-"+i]).length;
  prog(its.length?feitos/its.length:0);
  app.innerHTML=`<div class="card">`+its.map((t,i)=>{
    const k="aval-"+i,v=V.m1[k]||"";
    return `<div class="item"><div class="cod">A-${i+1}</div><div class="txt">${t}</div>
      <div class="marks">
        <button class="mk" data-k="${k}" data-v="ok" aria-pressed="${v==="ok"}">Conforme</button>
        <button class="mk" data-k="${k}" data-v="nc" aria-pressed="${v==="nc"}">Não conf.</button>
        <button class="mk" data-k="${k}" data-v="na" aria-pressed="${v==="na"}">N/A</button>
        <button class="mk" data-k="${k}" data-v="falta" aria-pressed="${v==="falta"}">Faltante</button>
      </div></div>`; }).join("")+`</div>`;
  app.querySelectorAll(".mk").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.k;
    V.m1[k]=V.m1[k]===b.dataset.v?"":b.dataset.v;
    if(V.m1[k]!=="nc"){ delete V.nc[k]; delete V.prop[k]; }

  setDock(`<button class="btn primary" id="go">${feitos<its.length?`Faltam ${its.length-feitos} itens`:"Continuar"}</button>`);
  dockIn.querySelector("#go").onclick=async()=>{
    if(feitos<its.length){ aviso("Marque todos os componentes antes de seguir."); return; }
    await salvar(); etapa=4; render(); };
}

function etNC(){
  prog(null);
  const ks=chavesAval(V).filter(k=>V.m1[k]==="nc");
  if(!ks.length){
    app.innerHTML=`<div class="empty">Nenhum componente não conforme.<br>Esta válvula passou em tudo.</div>`;

    return;
  }
  app.innerHTML=`<p class="note" style="margin:0 0 11px">Todo componente não conforme precisa de pelo menos uma foto (até três), destino e recomendação.</p>`+
    ks.map(k=>{ const d=V.nc[k]||{};
      return `<div class="card" style="margin-bottom:11px"><div class="item">
        <div class="cod">A-${+k.split("-")[1]+1} · não conforme</div>

                border-radius:50%;padding:0;font-size:13px;line-height:1;background:var(--nc);color:#fff;border:0;flex:none">×</button></span>`).join("")}
            ${(d.fotos||[]).length<3?`<button data-foto="${k}">Foto ${(d.fotos||[]).length+1} de 3</button>`:""}
          </div>
          <div class="dest">
            <button data-d="${k}" data-val="recuperacao" aria-pressed="${d.destino==="recuperacao"}">Recuperação</button>
            <button data-d="${k}" data-val="substituicao" aria-pressed="${d.destino==="substituicao"}">Não recuperação</button>
          </div>
          <textarea data-rec="${k}" placeholder="${d.destino==="substituicao"?"Recomendação: peça a fabricar e por quê":"Recomendação: como recuperar"}">${esc(d.rec)}</textarea>
        </div></div></div>`; }).join("");
  app.querySelectorAll("[data-foto]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.foto;
    tirarFoto(async img=>{ const d=Object.assign({fotos:[]},V.nc[k]);

    const k=b.dataset.del,d=Object.assign({fotos:[]},V.nc[k]);

  app.querySelectorAll("[data-rec]").forEach(t=>t.oninput=()=>{
    const k=t.dataset.rec; V.nc[k]=Object.assign({},V.nc[k],{rec:t.value}); autoSalvar(); });
  const pend=ncPendente().length;
  setDock(`<button class="btn primary" id="go">${pend?`${pend} item(ns) incompleto(s)`:"Continuar"}</button>`);
  dockIn.querySelector("#go").onclick=async()=>{ await salvar();
    if(ncPendente().length){ aviso("Cada não conformidade precisa de foto, destino e recomendação."); etNC(); return; }
    etapa=5; render(); };
}

function etResumo(){
  prog(null);
  const ks=chavesAval(V), ncs=ks.filter(k=>V.m1[k]==="nc");

      <div class="tot"><span>Margem</span><b class="${T.margem>=0?"mg-ok":"mg-bad"}">${brl(T.margem)}${T.preco>0?" · "+T.pct.toFixed(1)+"%":""}</b></div>
    </div>
    ${(cfg.taxas||[]).every(t=>!Number(t.valor))?`<div class="warn">As taxas de hora estão zeradas. Preencha na aba Taxas para o custo sair certo.</div>`:""}`;

  const achar=id=>{ const [vid,k]=id.split("|"); const v=OS.valvulas.find(x=>x.id===vid); return {v,k}; };
  app.querySelectorAll("[data-inc]").forEach(b=>b.onclick=async()=>{
    const {v,k}=achar(b.dataset.inc); const p=v.prop[k]||{horas:{}};
    p.inc=!p.inc;
    if(p.inc&&!p.desc) p.desc=(v.nc[k]&&v.nc[k].rec)?v.nc[k].rec.slice(0,90):textoItem(k,v);
    v.prop[k]=p; await salvar(); telaAditivo(); });
  app.querySelectorAll("[data-p]").forEach(i=>i.oninput=()=>{
    const {v,k}=achar(i.dataset.p), f=i.dataset.f, p=v.prop[k]||{horas:{}};
    if(f.startsWith("h:")){ p.horas=p.horas||{}; p.horas[f.slice(2)]=i.value; } else p[f]=i.value;
    v.prop[k]=p;
    if(f!=="desc"){ clearTimeout(i._t); i._t=setTimeout(async()=>{ await salvar(); telaAditivo(); },700); } else autoSalvar(); });

  setDock(`<button class="btn primary" id="volta">Voltar para a OS</button>
           <button class="btn ghost" id="pp">Gerar proposta de aditivo</button>`);

    pdfProposta(); };
}

/* ---------------- histórico */

let cacheOS=null, ctxGrupo=null, histFiltro="";

async function carregarTodas(){
  const out=[];
  for(const m of indice){
    if(OS && OS.id===m.id){ out.push(OS); continue; }
    const o=await get("os:"+m.id);
    if(o) out.push(o);
  }
  cacheOS=out; return out;
}

function linhasHistorico(oss){
  const linhas=[];
  oss.forEach(o=>{
    const cli=(clientes.find(c=>c.id===o.clienteId)||{}).nome||"";
    (o.valvulas||[]).forEach(v=>{
      const fab=(fabricantes.find(f=>f.id===v.fabId)||{}).nome||"sem fabricante";
      const ad=chavesAval(v).filter(k=>v.m1[k]==="nc").map(k=>({k,texto:textoItem(k,v),
        destino:(v.nc[k]||{}).destino, p:(v.prop||{})[k]||{}}));
      const preco=ad.filter(a=>a.p.inc).reduce((t,a)=>t+(Number(a.p.preco)||0),0);
      const custo=ad.filter(a=>a.p.inc).reduce((t,a)=>t+custoItem(a.p),0);
      linhas.push({os:o.numero, osId:o.id, data:o.data, cliente:cli, v, fab,
        tipo:v.tipo?TIPOS[v.tipo].nome:"—", modelo:v.modelo||"sem modelo",
        bitola:v.bitola||"", ad, preco, custo, chave:fab+" · "+(v.modelo||"sem modelo")+" · "+(v.bitola?v.bitola+'"':"sem bitola")});
    });
  });
  return linhas;
}

function telaHistorico(){
  cab("Histórico de válvulas","Todas as OS","");
  prog(null); setDock("",true);
  app.innerHTML=`<div class="empty">Carregando histórico...</div>`;
  (async()=>{
    const oss=await carregarTodas();
    const todas=linhasHistorico(oss);
    const q=histFiltro.trim().toLowerCase();
    const vis=!q?todas:todas.filter(l=>[l.fab,l.modelo,l.tipo,l.cliente,l.os,l.v.tag].join(" ").toLowerCase().includes(q));

    const grupos={};
    vis.forEach(l=>{ const g=grupos[l.chave]=grupos[l.chave]||{n:0,nc:0,preco:0,custo:0,comp:{},linhas:[]};
      g.n++; g.linhas.push(l);
      if(l.ad.length) g.nc++;
      g.preco+=l.preco; g.custo+=l.custo;
      l.ad.forEach(a=>{ g.comp[a.texto]=(g.comp[a.texto]||0)+1; }); });

    const totalPreco=vis.reduce((t,l)=>t+l.preco,0);
    const totalCusto=vis.reduce((t,l)=>t+l.custo,0);
    const comNC=vis.filter(l=>l.ad.length).length;

    const compGeral={};
    vis.forEach(l=>l.ad.forEach(a=>{ compGeral[a.texto]=(compGeral[a.texto]||0)+1; }));
    const ranking=Object.entries(compGeral).sort((a,b)=>b[1]-a[1]).slice(0,6);

    const gs=Object.entries(grupos).sort((a,b)=>b[1].n-a[1].n);

    app.innerHTML=`<label class="f" style="background:#fff;border:1px solid var(--rule);border-radius:12px;margin-bottom:11px">
        <span>Buscar por fabricante, modelo, tipo, cliente, OS ou TAG</span>
        <input id="hb" value="${esc(histFiltro)}" placeholder="digite para filtrar"></label>
      <div class="big" style="margin-top:0">
        <div class="tot"><span>Válvulas atendidas</span><b>${vis.length}</b></div>
        <div class="tot"><span>Com não conformidade</span><b>${comNC}${vis.length?" · "+Math.round(comNC/vis.length*100)+"%":""}</b></div>
        <div class="tot"><span>Aditivos propostos</span><b>${brl(totalPreco)}</b></div>
        <div class="tot"><span>Margem dos aditivos</span><b class="${totalPreco-totalCusto>=0?"mg-ok":"mg-bad"}">${brl(totalPreco-totalCusto)}</b></div>
      </div>
      ${ranking.length?`<h2>Componentes que mais reprovam</h2><div class="card">`+ranking.map(([c,n])=>
        `<div class="item" style="padding:9px 13px;display:flex;gap:10px;align-items:center">
          <div style="flex:1;font-size:15px">${esc(c)}</div><b style="color:var(--nc)">${n}</b></div>`).join("")+`</div>`:""}
      ${gs.length?`<h2>Por fabricante, modelo e bitola</h2><div class="list">`+gs.map(([g,d])=>
        `<button class="row" data-g="${esc(g)}"><span class="g"><b>${esc(g)}</b>
          <small>${d.n} válvula${d.n===1?"":"s"} · ${d.nc} com não conformidade · ${brl(d.preco)} em aditivos</small></span>
          <span class="pill ${d.nc?"p-rep":"p-lib"}">${d.n?Math.round(d.nc/d.n*100):0}%</span></button>`).join("")+`</div>`
        :`<div class="empty">Nenhuma válvula no histórico ainda.</div>`}`;

    const hb=document.getElementById("hb");
    if(hb) hb.oninput=()=>{ histFiltro=hb.value; const p=hb.selectionStart; telaHistorico();
      setTimeout(()=>{ const n=document.getElementById("hb"); if(n){n.focus();n.setSelectionRange(p,p);} },30); };
    app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ ctxGrupo=b.dataset.g; tela="det"; render(); });
  })();
}

/* ---------------- cadastros */
function cadastro(kind){
  const arr=kind==="cli"?clientes:fabricantes;
  if(kind==="fab") arr.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  cab(kind==="cli"?"Clientes":"Fabricantes",kind==="cli"?"Relatórios por cliente":"Histórico por marca",false);
  prog(null);
  const linhas=arr.map(x=>{
    const n=kind==="cli"?indice.filter(m=>m.clienteId===x.id).length
      :indice.reduce((a,m)=>a,0);
    const extra=kind==="cli"?`${n} OS`:(esc([x.municipio,x.uf].filter(Boolean).join("/"))||(x.cnpj?"sem cidade":"sem CNPJ"));
    return `<div class="row"><span class="g" data-x="${x.id}" style="cursor:pointer"><b>${esc(x.nome)}</b>
      <small>${esc(x.cnpj)||"sem CNPJ"}</small></span>
      <span class="pill p-and">${extra}</span>
      <button data-rm="${x.id}" style="border:0;background:none;color:var(--nc);font-size:20px;cursor:pointer;padding:0 4px">×</button></div>`;
  }).join("");
  app.innerHTML=(linhas?`<div class="list">${linhas}</div>`:`<div class="empty">Nenhum cadastro ainda.</div>`)+
    `<h2>Novo cadastro</h2><div class="card">
      <label class="f"><span>CNPJ</span><input id="cc" inputmode="numeric" placeholder="00.000.000/0000-00"></label>
      <label class="f" style="padding:9px 13px"><button class="btn ghost" id="bus" style="padding:11px">Buscar dados pelo CNPJ</button></label>
      <label class="f"><span>Nome</span><input id="nn" placeholder="${kind==="cli"?"razão social":"marca da válvula"}"></label>
      <label class="f"><span>Cidade e UF</span><input id="cid" placeholder="opcional"></label>
    </div><button class="btn ghost" id="add" style="margin-top:10px">Adicionar</button>
    <p class="note">A consulta preenche razão social, endereço e contato pela Receita. Sem internet, dá para digitar direto.</p>
    ${kind==="fab"?`<button class="btn ghost" id="compl" style="margin-top:10px">Completar dados pelos CNPJs cadastrados</button>
      <button class="btn ghost" id="seed" style="margin-top:9px">Repor marcas conhecidas</button>
      <p class="note">Inclui as marcas de mercado que ainda não estiverem na lista. Nenhuma é duplicada.</p>`:""}`;
  setDock("",true);
  let achado=null;
  document.getElementById("bus").onclick=async()=>{
    const b=document.getElementById("bus"),t=b.textContent;
    b.textContent="Consultando..."; b.disabled=true;
    try{ achado=await consultarCNPJ(document.getElementById("cc").value);
      document.getElementById("nn").value=achado.nome;
      document.getElementById("cid").value=[achado.municipio,achado.uf].filter(Boolean).join(" / ");
      if(achado.situacao&&!/ATIVA/i.test(achado.situacao)) aviso("Atenção: situação cadastral "+achado.situacao+".");
    }catch(e){ aviso(e.message); }
    b.textContent=t; b.disabled=false; };
  document.getElementById("add").onclick=async()=>{
    const n=document.getElementById("nn").value.trim();
    if(!n){ aviso("Busque pelo CNPJ ou digite o nome."); return; }
    const dd=achado||{};
    arr.unshift({id:uid(kind),nome:n,cnpj:fmtCnpj(document.getElementById("cc").value),
      fantasia:dd.fantasia||"",endereco:dd.endereco||"",municipio:dd.municipio||"",uf:dd.uf||"",
      cep:dd.cep||"",telefone:dd.telefone||"",email:dd.email||""});
    achado=null; await set(kind==="cli"?"clientes":"fabricantes",arr); render(); };
  const cp=document.getElementById("compl");
  if(cp) cp.onclick=async()=>{
    const alvo=fabricantes.filter(f=>soDig(f.cnpj).length===14 && !f.municipio);
    if(!alvo.length){ aviso("Nenhum fabricante com CNPJ pendente de consulta."); return; }
    cp.disabled=true; let n=0;
    for(const f of alvo){
      cp.textContent="Consultando "+f.nome+"...";
      try{ const dd=await consultarCNPJ(f.cnpj);
        Object.assign(f,{fantasia:dd.fantasia||f.fantasia,endereco:dd.endereco||f.endereco,
          municipio:dd.municipio,uf:dd.uf,cep:dd.cep,telefone:dd.telefone,email:dd.email});
        n++;
      }catch(e){}
    }
    await set("fabricantes",fabricantes);
    cp.disabled=false; aviso(n+" de "+alvo.length+" cadastro(s) completado(s)."); render(); };
  const sd=document.getElementById("seed");
  if(sd) sd.onclick=async()=>{
    const tem=fabricantes.map(f=>f.nome.toLowerCase());
    const novos=FABRICANTES_PADRAO.filter(f=>!tem.includes(f.nome.toLowerCase()));
    if(!novos.length){ aviso("Todas as marcas conhecidas já estão na lista."); return; }
    novos.forEach(f=>fabricantes.push(fabDe(f)));
    fabricantes.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
    await set("fabricantes",fabricantes);
    aviso(novos.length+" marca(s) incluída(s)."); render(); };
  app.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    if(kind==="cli") ctxCliente=b.dataset.x; else ctxFab=b.dataset.x; tela="det"; render(); });
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.rm;
    const usados=kind==="cli"?indice.filter(m=>m.clienteId===id).length:0;
    if(usados){ aviso("Não dá para excluir: há "+usados+" OS usando este cadastro."); return; }
    if(!confirm("Excluir este cadastro?")) return;
    const novo=arr.filter(x=>x.id!==id);
    if(kind==="cli") clientes=novo; else fabricantes=novo;
    await tombstone(kind==="cli"?"cli":"fab",id);
    await set(kind==="cli"?"clientes":"fabricantes",novo); render(); });
}

    ["Telefone",x.telefone],["E-mail",x.email]].filter(p=>p[1]);

async function hashTxt(t){

function trocaStrings(obj,fn){ // percorre o objeto e troca strings conforme fn (retorna nova string ou undefined)
  if(Array.isArray(obj)){ for(let i=0;i<obj.length;i++){ const v=obj[i];
      if(typeof v==="string"){ const n=fn(v); if(n!==undefined) obj[i]=n; } else if(v&&typeof v==="object") trocaStrings(v,fn); } }
  else if(obj&&typeof obj==="object"){ for(const k in obj){ const v=obj[k];
      if(typeof v==="string"){ const n=fn(v); if(n!==undefined) obj[k]=n; } else if(v&&typeof v==="object") trocaStrings(v,fn); } }
  return obj; }

    const r=await sbFetch(`${SB_URL}/rest/v1/${SB_TABLE}?select=id&id=in.(${lote.map(h=>"foto_"+h).join(",")})`,{headers:SB_HEAD});
    (await r.json()).forEach(x=>fotosNaNuvem.add(String(x.id).slice(5))); } }
async function desidratar(osList){ // copia das OS com fotos trocadas por referência; sobe as fotos que faltam
  const copia=JSON.parse(JSON.stringify(osList)), novas={}, todas=[];
  const strs=[]; trocaStrings(copia,v=>{ if(v.startsWith("data:image")) strs.push(v); return undefined; });
  const mapa={}; for(const v of strs){ if(!mapa[v]){ const h=await hashFoto(v); mapa[v]=h; todas.push(h); novas[h]=v; } }
  trocaStrings(copia,v=>mapa[v]?FOTO_PFX+mapa[v]:undefined);
  await fotosExistentes(todas);
  for(const h of todas){ if(fotosNaNuvem.has(h)) continue;
    await sbFetch(`${SB_URL}/rest/v1/${SB_TABLE}`,{method:"POST",
      headers:{...SB_HEAD,Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify([{id:"foto_"+h,dados:{img:novas[h]},atualizado_em:new Date().toISOString()}])});
    fotosNaNuvem.add(h); try{ await IDB.put("ft:"+h,novas[h]); }catch(e){} }
  return copia; }
async function hidratar(dados){ // troca referências pelas fotos (cache no aparelho, senão baixa)
  if(!dados||!dados.os) return dados;
  const refs=new Set(); trocaStrings(dados.os,v=>{ if(v.startsWith(FOTO_PFX)) refs.add(v.slice(FOTO_PFX.length)); return undefined; });
  const img={}, faltam=[];
  for(const h of refs){ let t; try{ t=await IDB.get("ft:"+h); }catch(e){} if(t) img[h]=t; else faltam.push(h); }
  for(let i=0;i<faltam.length;i+=4){ const lote=faltam.slice(i,i+4);
    const r=await sbFetch(`${SB_URL}/rest/v1/${SB_TABLE}?select=id,dados&id=in.(${lote.map(h=>"foto_"+h).join(",")})`,{headers:SB_HEAD});
    for(const x of await r.json()){ const h=String(x.id).slice(5); if(x.dados&&x.dados.img){ img[h]=x.dados.img; fotosNaNuvem.add(h); try{ await IDB.put("ft:"+h,x.dados.img); }catch(e){} } } }
  refs.forEach(h=>{ if(img[h]) fotosNaNuvem.add(h); });
  trocaStrings(dados.os,v=>v.startsWith(FOTO_PFX)&&img[v.slice(FOTO_PFX.length)]?img[v.slice(FOTO_PFX.length)]:undefined);
  return dados; }
async function nuvemCarregar(){
  const r=await sbFetch(`${SB_URL}/rest/v1/${SB_TABLE}?id=eq.${SB_ID}&select=dados,atualizado_em`,{headers:SB_HEAD});
  const arr=await r.json(); const row=(arr&&arr[0])||null;
  if(row&&row.dados){ verNuvem=String(row.dados.ver||""); if(verNuvem>APP_VER) avisoVersao(); await hidratar(row.dados); }
  return row;
}
async function nuvemSalvar(jaPuxou){
  if(!jaPuxou){ const row=await nuvemCarregar(); if(row&&row.dados) await aplicarNuvem(row.dados); }
  const {pacote}=await gerarPacote();
  if(verNuvem>APP_VER){ avisoVersao(); const e=new Error("app desatualizado"); e.status="versão"; throw e; }
  const osLeve=await desidratar(pacote.os);
  const dados={cfg:pacote.cfg,clientes:pacote.clientes,fabricantes:pacote.fabricantes,os:osLeve,del:TOMB,ver:APP_VER};
  const body=[{id:SB_ID,dados,atualizado_em:new Date().toISOString()}];
  await sbFetch(`${SB_URL}/rest/v1/${SB_TABLE}`,{method:"POST",
    headers:{...SB_HEAD,Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(body)});
}
async function localOSs(){ const out=[]; for(const m of indice){ const o=await get("os:"+m.id); if(o) out.push(o); } return out; }
function mesclarOS(a,b){
  // junta duas versões da mesma OS sem perder válvula: união por id, cada válvula fica com a versão mais nova
  const nova=String(b.atualizado||"")>String(a.atualizado||"")?b:a, velha=nova===a?b:a;
  const del=Object.assign({},velha.valvDel||{});
  for(const id in (nova.valvDel||{})){ if(!del[id]||String(nova.valvDel[id])>String(del[id])) del[id]=nova.valvDel[id]; }
  const porV={};
  (velha.valvulas||[]).forEach(v=>porV[v.id]=v);
  (nova.valvulas||[]).forEach(v=>{ const o=porV[v.id]; if(!o||String(v.atualizado||"")>=String(o.atualizado||"")) porV[v.id]=v; });
  let vs=Object.values(porV).filter(v=>!(del[v.id]&&String(del[v.id])>=String(v.atualizado||"")));
  vs.sort((x,y)=>(x.item||0)-(y.item||0)||String(x.id).localeCompare(String(y.id)));
  const itens=vs.map(v=>v.item); if(new Set(itens).size!==itens.length) vs.forEach((v,i)=>v.item=i+1);
  const out=Object.assign({},nova,{valvulas:vs,valvDel:del});
  out.atualizado=String(a.atualizado||"")>String(b.atualizado||"")?a.atualizado:b.atualizado;
  return out;
}
async function aplicarNuvem(dados){
  // offline-first: nunca perde dado — por OS mantém a versão mais nova (por 'atualizado'); cadastros por união de id
  aplicandoNuvem=true;
  try{
    TOMB=mergeTomb(TOMB,dados.del); await set("tombs",TOMB);
    const locais=await localOSs(), porId={};
    locais.forEach(o=>porId[o.id]=o);
    (dados.os||[]).forEach(o=>{ const l=porId[o.id]; porId[o.id]=l?mesclarOS(l,o):o; });
    // OS aberta na tela: incorpora as válvulas que vieram de outro aparelho, sem trocar a que está sendo editada
    if(OS && porId[OS.id]){ const m=porId[OS.id];
      OS.valvulas=m.valvulas.map(x=>{ if(V&&x.id===V.id) return V; return x; });
      OS.valvDel=m.valvDel; OS.atualizado=m.atualizado; porId[OS.id]=OS; }
    for(const id in porId){ const tv=TOMB.os[id]; if(tv && String(tv)>=String(porId[id].atualizado||"")) delete porId[id]; }
    const vivos=new Set(Object.keys(porId));
    for(const o of locais){ if(!vivos.has(o.id)){ await set("os:"+o.id,null); local("os:"+o.id,null); } }
    const osFinal=Object.values(porId);
    try{ await hidratar({os:osFinal}); }catch(e){} // referência "sbf:" que ficou no aparelho (ex.: versão antiga) vira foto; se falhar, tenta no próximo sync
    indice=[];
    for(const o of osFinal){ await set("os:"+o.id,o);
      indice.push({id:o.id,numero:o.numero,clienteId:o.clienteId,data:o.data,
        qtd:(o.valvulas||[]).length,situacao:situacaoOS(o),criado:o.criado}); }
    indice.sort((a,b)=>String(b.criado||"").localeCompare(String(a.criado||"")));
    await set("os:index",indice);
    const uniao=(loc,nuv)=>{ const ids=new Set((loc||[]).map(x=>x.id)); const r=(loc||[]).slice();
      (nuv||[]).forEach(x=>{ if(!ids.has(x.id)) r.push(x); }); return r; };
    clientes=uniao(clientes,dados.clientes).filter(x=>!TOMB.cli[x.id]); await set("clientes",clientes);
    fabricantes=uniao(fabricantes,dados.fabricantes).filter(x=>!TOMB.fab[x.id]); await set("fabricantes",fabricantes); await dedupeFab();
    if(dados.cfg&&dados.cfg.taxas&&dados.cfg.taxas.length&&String(dados.cfg.atualizado||"")>=String(cfg.atualizado||"")){ cfg=dados.cfg; await set("cfg",cfg); }
    cacheOS=null;
  } finally { aplicandoNuvem=false; }
}
function agendarSync(){
  if(aplicandoNuvem || !syncLiberado) return;
  syncPend=true; marcaSync("pendente");
  clearTimeout(syncTimer); syncTimer=setTimeout(sincronizar,900);
}
let syncRodando=false;
async function sincronizar(){
  if(!syncPend) return;
  if(!navigator.onLine){ marcaSync("offline"); return; }
  if(semLogin()) return;
  if(syncRodando){ clearTimeout(syncTimer); syncTimer=setTimeout(sincronizar,1500); return; }
  syncRodando=true; marcaSync("enviando");
  try{ syncPend=false; await nuvemSalvar(); marcaSync(syncPend?"pendente":"ok"); if(syncPend){ clearTimeout(syncTimer); syncTimer=setTimeout(sincronizar,900); } }
  catch(e){ syncPend=true; marcaSync(navigator.onLine?"erro":"offline",e); clearTimeout(syncTimer); syncTimer=setTimeout(sincronizar,20000); }
  finally{ syncRodando=false; }
}
async function iniciarNuvem(){
  if(semLogin()){ syncLiberado=false; return; }
  marcaSync("carregando");
  try{
    const row=await nuvemCarregar();
    if(row&&row.dados) await aplicarNuvem(row.dados);
    syncLiberado=true;
    if(navigator.onLine){ marcaSync("enviando"); await nuvemSalvar(true); marcaSync("ok"); }
    else marcaSync("offline");
    render();
  }catch(e){ syncLiberado=true; syncPend=true; marcaSync(navigator.onLine?"erro":"offline",e); clearTimeout(syncTimer); syncTimer=setTimeout(sincronizar,20000); }
}
async function aoVoltarFoco(){
  if(!syncLiberado) return iniciarNuvem();
  if(!navigator.onLine){ marcaSync("offline"); return; }
  if(semLogin()) return;
  if(syncPend){ await sincronizar(); return; }
  try{ marcaSync("carregando"); const row=await nuvemCarregar();
    if(row&&row.dados){ await aplicarNuvem(row.dados); render(); } marcaSync("ok");
  }catch(e){ marcaSync("erro",e); }
}
window.addEventListener("online",()=>{ if(syncPend) sincronizar(); else if(syncLiberado) aoVoltarFoco(); });
window.addEventListener("offline",()=>marcaSync("offline"));
document.getElementById("syncStatus").onclick=telaLogin;
function telaLogin(){
  if(document.getElementById("loginBox")) return;
  const d=document.createElement("div"); d.id="loginBox";
  d.style.cssText="position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px";
  const logado=!!sessao;
  d.innerHTML=`<div class="card" style="max-width:380px;width:100%;padding:16px">
    <h2 style="margin-top:0">Nuvem New Válvulas</h2>
    ${logado?`<p class="note">Conectado como <b>${esc(sessao.email)}</b>. Status: ${esc(document.getElementById("syncStatus").textContent)}${ultimoErro?" · "+esc(ultimoErro):""}</p>
      <button class="btn ghost" id="lgSair" style="margin-top:8px">Sair desta conta</button>`
    :`<p class="note">Status: ${esc(document.getElementById("syncStatus").textContent)}${ultimoErro?" · "+esc(ultimoErro):""}</p><p class="note">Conta da empresa (opcional por enquanto).</p>
      <label class="f"><span>E-mail</span><input id="lgEmail" type="email" autocomplete="username" inputmode="email"></label>
      <label class="f"><span>Senha</span><input id="lgSenha" type="password" autocomplete="current-password"></label>
      <button class="btn primary" id="lgEntrar" style="margin-top:8px">Entrar</button>`}
    <button class="btn ghost" id="lgFechar" style="margin-top:8px">Fechar</button></div>`;
  document.body.appendChild(d);
  const fechar=()=>d.remove(); d.querySelector("#lgFechar").onclick=fechar;
  const sair=d.querySelector("#lgSair");
  if(sair) sair.onclick=()=>{ if(!confirm("Sair da conta? Os dados continuam neste aparelho.")) return;
    sessao=null; local("sb:sessao",null); fechar(); };
  const ent=d.querySelector("#lgEntrar");
  if(ent) ent.onclick=async()=>{ const em=d.querySelector("#lgEmail").value.trim(), se=d.querySelector("#lgSenha").value;
    if(!em||!se){ aviso("Preencha e-mail e senha."); return; }
    ent.disabled=true; ent.textContent="Entrando...";
    try{ await sbAuth("password",{email:em,password:se}); fechar(); syncPend=true; iniciarNuvem(); }
    catch(e){ aviso(e.status===400?"E-mail ou senha incorretos.":"Não consegui entrar: "+e.message); ent.disabled=false; ent.textContent="Entrar"; } };
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) autoSalvar(true); else aoVoltarFoco(); });
window.addEventListener("pagehide",()=>autoSalvar(true));
